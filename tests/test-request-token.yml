name: Test request-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create label config file
        run: |
          cat > /tmp/labels-rt.yml << 'EOF'
          - name: bug
            color: d73a4a
            description: Something isn't working
          EOF
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          config-file: /tmp/labels-rt.yml
          request-token: ${{ github.token }}
          dry-run: 'true'
      - name: Assert action completed
        run: |
          echo "Action completed successfully with request-token input"
          echo "PASS"
