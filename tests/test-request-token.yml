name: Test label-sync with request-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create label config file
        run: |
          cat > /tmp/labels-request-token.yml << 'EOF'
          - name: bug
            color: "d73a4a"
            description: "Something isn't working"
          - name: feature
            color: "0075ca"
            description: "New feature request"
          EOF

      - name: Run label sync with request-token in dry-run mode
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config-file: /tmp/labels-request-token.yml
          request-token: dummy-request-token
          dry-run: 'true'
          delete-other-labels: 'false'

      - name: Assert action completed successfully with request-token
        run: |
          echo "Action completed with request-token input provided"
          echo "PASS"
