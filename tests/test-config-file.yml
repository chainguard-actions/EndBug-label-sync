name: Test label-sync with config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create label config file
        run: |
          cat > /tmp/labels.yml << 'EOF'
          - name: bug
            color: "d73a4a"
            description: "Something isn't working"
          - name: enhancement
            color: "a2eeef"
            description: "New feature or request"
          EOF

      - name: Run label sync in dry-run mode with config file
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          config-file: /tmp/labels.yml
          dry-run: 'true'
          delete-other-labels: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
