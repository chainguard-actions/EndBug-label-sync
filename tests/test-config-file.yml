name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          config-file: ${{ github.workspace }}/actions/hardened/EndBug--label-sync/v2.3.1/tests/fixtures/labels.yml
          dry-run: 'true'
          delete-other-labels: 'false'
      - name: Assert action completed
        run: |
          echo "Action completed successfully in dry-run mode with config-file"
          echo "PASS"
