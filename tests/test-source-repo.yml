name: Test label-sync from source repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run label sync from source repo in dry-run mode
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          source-repo: 'actions/checkout'
          dry-run: 'true'
          delete-other-labels: 'false'

      - name: Assert action completed successfully
        run: |
          echo "Action completed in dry-run mode copying from source-repo"
          echo "PASS"
